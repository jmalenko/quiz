openapi: 3.0.3
info:
  title: Quiz API
  description: REST API for the Quiz application
  version: 1.0.0

paths:
  /api/questions:
    get:
      summary: Get all quiz questions
      operationId: getQuestions
      responses:
        '200':
          description: List of questions (without correct answers)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestionDto'

  /api/answers:
    post:
      summary: Submit an answer and get feedback
      operationId: checkAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Answer evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '404':
          description: Question not found

components:
  schemas:
    QuestionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        text:
          type: string
          example: "What is 2 + 2?"
        options:
          type: array
          items:
            type: string
          minItems: 2
          example: ["3", "4", "5"]
      required:
        - id
        - text
        - options

    AnswerRequest:
      type: object
      properties:
        questionId:
          type: integer
          format: int64
          example: 1
        selectedOption:
          type: integer
          description: 0-based index into options array
          example: 1
      required:
        - questionId
        - selectedOption

    AnswerResponse:
      type: object
      properties:
        correct:
          type: boolean
          example: true
        correctOption:
          type: integer
          description: 0-based index of the correct option
          example: 1
      required:
        - correct
        - correctOption
