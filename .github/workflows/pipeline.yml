name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/quiz-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/quiz-frontend

jobs:

  # ─────────────────────────────────────────────
  # Job 1 — Backend: build, unit tests, checkstyle
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn verify -f containers/backend/pom.xml

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: containers/backend/target/surefire-reports/

  # ─────────────────────────────────────────────
  # Job 2 — Frontend: unit tests
  # ─────────────────────────────────────────────
  frontend-test:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: containers/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix containers/frontend

      - name: Run Vitest
        run: npm test --prefix containers/frontend

  # ─────────────────────────────────────────────
  # Job 3 — Backend integration tests (Testcontainers)
  # ─────────────────────────────────────────────
  backend-integration-test:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run integration tests
        run: mvn verify -f containers/backend/pom.xml -Dtest=QuizApiIntegrationTest -DfailIfNoTests=false

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-integration
          path: containers/backend/target/surefire-reports/

  # ─────────────────────────────────────────────
  # Job 4 — End-to-end tests (Playwright)
  # ─────────────────────────────────────────────
  e2e-test:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [backend-integration-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: technical_processes/09-verification/generated/e2e/package-lock.json

      - name: Build stack
        run: docker compose -f technical_processes/09-verification/generated/docker-compose.yml up --build -d

      - name: Install Playwright + Chromium
        run: |
          npm ci --prefix technical_processes/09-verification/generated/e2e
          npx --prefix technical_processes/09-verification/generated/e2e playwright install chromium --with-deps

      - name: Run E2E tests
        # On Linux CI the Docker CLI is available directly (no 'wsl' prefix needed)
        # The BACKEND_CONTAINER env var allows quiz.spec.js to use the correct restart command
        env:
          DOCKER_CMD: docker
        run: npm test --prefix technical_processes/09-verification/generated/e2e

      - name: Tear down stack
        if: always()
        run: docker compose -f technical_processes/09-verification/generated/docker-compose.yml down

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: technical_processes/09-verification/generated/e2e/playwright-report/

  # ─────────────────────────────────────────────
  # Job 5 — Build and push Docker images to GHCR
  # Runs only on push to main (not on PRs)
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [e2e-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: echo "version=1.0.0-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: containers/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: containers/frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}

  # ─────────────────────────────────────────────
  # Job 6 — Deploy to target host via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Record previous image tags (for rollback)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker inspect quiz-backend-1  --format '{{.Config.Image}}' > /tmp/previous_backend_tag  2>/dev/null || echo "none" > /tmp/previous_backend_tag
            docker inspect quiz-frontend-1 --format '{{.Config.Image}}' > /tmp/previous_frontend_tag 2>/dev/null || echo "none" > /tmp/previous_frontend_tag
            echo "Previous backend:  $(cat /tmp/previous_backend_tag)"
            echo "Previous frontend: $(cat /tmp/previous_frontend_tag)"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            cd ~/quiz
            git pull origin main
            docker compose -f technical_processes/09-verification/generated/docker-compose.yml pull
            docker compose -f technical_processes/09-verification/generated/docker-compose.yml up -d

      - name: Run smoke tests
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: bash ~/quiz/technical_processes/10-transition/generated/smoke-test.sh

      - name: Generate Transition Report
        if: success()
        run: |
          VERSION="${{ needs.build-and-push.outputs.version }}"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Transition Report — Quiz Application

          | Field | Value |
          |-------|-------|
          | Release version | \`${VERSION}\` |
          | Deployment date | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | Deployed by | ${{ github.actor }} |
          | Repository commit | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | Pipeline run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ## Artefacts Deployed

          | Artefact | Tag |
          |----------|-----|
          | Backend image | \`${{ env.BACKEND_IMAGE }}:${VERSION}\` |
          | Frontend image | \`${{ env.FRONTEND_IMAGE }}:${VERSION}\` |

          ## Smoke Test Results

          | Check | Result |
          |-------|--------|
          | ST-01 — Frontend reachable (HTTP 200) | ✅ PASS |
          | ST-02 — Backend reachable via nginx proxy (HTTP 200) | ✅ PASS |
          | ST-03 — At least one question returned | ✅ PASS |

          ## Quality Gate

          | Criterion | Status |
          |-----------|--------|
          | System deployed in target environment | ✅ |
          | All smoke tests passed | ✅ |
          | Transition Report produced | ✅ |

          **Overall verdict: ✅ PASSED — automatically approved (all pipeline stages succeeded)**
          EOF
